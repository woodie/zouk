name: Sign Huck .pkg

# Huck (github.com/woodie/huck) doesn't hold its own Developer ID certs or
# notarization credentials -- rather than duplicate those secrets into a
# second repo, this job checks out huck's own source at the tagged
# release and runs ITS Gradle build here, on a runner that already has
# this repo's signing identity/notary account. This isn't just secret-
# sharing convenience: jpackage's own --mac-sign (wired up via Compose
# Desktop's signing/notarization DSL, driven below entirely through -P
# properties) is the only thing that can correctly sign a native library
# bundled inside a .jar (Skiko's own .dylib, in huck's case) -- an
# external `codesign --deep` on an already-built .app can't reach into
# jar-embedded content at all, which is exactly what made the previous
# version of this workflow (sign a pre-built, downloaded .app) fail
# notarization. See docs/COMMENTS.md.
on:
  repository_dispatch:
    types: [sign-huck-pkg]

jobs:
  build-sign-notarize:
    runs-on: macos-latest

    steps:
      - name: Check out huck at the release tag
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.client_payload.repo }}
          ref: ${{ github.event.client_payload.tag }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Identical to release.yml's own "Import signing certificates" step
      # -- same certs, same keychain, just triggered from a different event
      # for a different app.
      - name: Import signing certificates
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
          INSTALLER_CERTIFICATE_P12_BASE64: ${{ secrets.INSTALLER_CERTIFICATE_P12_BASE64 }}
          INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.INSTALLER_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          keychain_path="$RUNNER_TEMP/signing.keychain-db"
          cert_path="$RUNNER_TEMP/certificate.p12"
          installer_cert_path="$RUNNER_TEMP/installer-certificate.p12"

          echo "$CERTIFICATE_P12_BASE64" | openssl base64 -d -A -out "$cert_path"
          echo "$INSTALLER_CERTIFICATE_P12_BASE64" | openssl base64 -d -A -out "$installer_cert_path"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"

          curl -fsSL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          curl -fsSL -o "$RUNNER_TEMP/DeveloperIDCA.cer" https://www.apple.com/certificateauthority/DeveloperIDCA.cer
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$keychain_path"
          security import "$RUNNER_TEMP/DeveloperIDCA.cer" -k "$keychain_path"

          security import "$cert_path" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security import "$installer_cert_path" -P "$INSTALLER_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$keychain_path"
          security list-keychain -d user -s "$keychain_path" $(security list-keychains -d user | sed 's/"//g')

      # Compose Desktop's own signing DSL reads these `compose.desktop.mac.*`
      # Gradle properties directly -- no changes needed in huck's
      # build.gradle.kts. `identity` is the shared "John Woodell
      # (754T277KBJ)" portion of both Developer ID cert names (Application
      # and Installer): jpackage looks up whichever cert type it needs by
      # matching this string against the keychain, the same way
      # release.yml's own CODESIGN_IDENTITY/INSTALLER_IDENTITY split
      # already works from one shared name.
      #
      # createDistributable, not packagePkg/notarizePkg -- confirmed via a
      # real v0.5.2 install + `pkgutil --expand-full`/`lsbom` that
      # packagePkg/notarizePkg bake a spurious extra `app/` directory into
      # the .pkg's payload (Huck lands at /Applications/app/Huck.app, not
      # /Applications/Huck.app), unrelated to and not fixed by
      # nativeDistributions.macOS.installationPath. That's a real bug in
      # this Compose Multiplatform version, not something under huck's
      # control -- so this only uses Compose Desktop's DSL for what it
      # actually needs to do (sign the .app, reaching the jar-embedded
      # dylib no external codesign call could touch), and hand-rolls the
      # .pkg itself below the same way release.yml already does for zouk.
      # See docs/COMMENTS.md.
      - name: Build and sign the .app
        run: |
          ./gradlew createDistributable \
            -Pcompose.desktop.mac.sign=true \
            -Pcompose.desktop.mac.signing.identity="John Woodell (754T277KBJ)"
          echo "APP_PATH=$(ls -d build/compose/binaries/main/app/*.app)" >> "$GITHUB_ENV"

      # Same notarize-the-.app-first pattern as release.yml's own
      # "Notarize and staple the .app" step -- identical `if !`/log-fetch
      # shape, just against huck's freshly built .app instead of zouk's.
      - name: Notarize and staple the .app
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
        run: |
          ditto -c -k --keepParent "$APP_PATH" huck-notarize-submission.zip
          if ! submission_output=$(xcrun notarytool submit huck-notarize-submission.zip \
            --apple-id "$NOTARY_APPLE_ID" \
            --password "$NOTARY_PASSWORD" \
            --team-id "$NOTARY_TEAM_ID" \
            --wait); then
            submit_failed=1
          else
            submit_failed=0
          fi
          echo "$submission_output"
          submission_id=$(echo "$submission_output" | awk '/id:/ { print $2; exit }')
          xcrun notarytool log "$submission_id" \
            --apple-id "$NOTARY_APPLE_ID" \
            --password "$NOTARY_PASSWORD" \
            --team-id "$NOTARY_TEAM_ID" || true
          if [ "$submit_failed" -eq 1 ]; then
            echo "::error::App notarization failed -- see the log printed above."
            exit 1
          fi
          xcrun stapler staple "$APP_PATH"

      # Same --component-plist/pkgbuild shape as this repo's own `make pkg`
      # target -- BundleIsVersionChecked forced false for the same reason
      # (see this repo's Makefile comment). bundle_id/version are read from
      # the built .app's own Info.plist rather than hardcoded, matching
      # this workflow's previous (pre-rewrite) version.
      - name: Build the installer .pkg
        run: |
          bundle_id=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/Contents/Info.plist")
          version=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP_PATH/Contents/Info.plist")
          mkdir -p pkgroot/Applications
          cp -R "$APP_PATH" "pkgroot/Applications/$(basename "$APP_PATH")"
          cat > component.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><array><dict>
          <key>BundleHasStrictIdentifier</key><true/>
          <key>BundleIsRelocatable</key><false/>
          <key>BundleIsVersionChecked</key><false/>
          <key>BundleOverwriteAction</key><string>upgrade</string>
          <key>RootRelativeBundlePath</key><string>Applications/$(basename "$APP_PATH")</string>
          </dict></array></plist>
          PLIST
          pkgbuild --root pkgroot \
            --install-location / \
            --component-plist component.plist \
            --identifier "$bundle_id" \
            --version "$version" \
            --sign "Developer ID Installer: John Woodell (754T277KBJ)" \
            "Huck-$version.pkg"
          echo "PKG_PATH=Huck-$version.pkg" >> "$GITHUB_ENV"

      - name: Notarize and staple the .pkg
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
        run: |
          xcrun notarytool submit "$PKG_PATH" \
            --apple-id "$NOTARY_APPLE_ID" \
            --password "$NOTARY_PASSWORD" \
            --team-id "$NOTARY_TEAM_ID" \
            --wait
          xcrun stapler staple "$PKG_PATH"

      # SIGNING_BRIDGE_TOKEN, not the default GITHUB_TOKEN -- this job's
      # own default token is scoped to zouk, with no access to huck's repo
      # at all. Same fine-grained PAT huck's own workflow uses to trigger
      # this dispatch in the first place. See docs/COMMENTS.md.
      - name: Attach the signed .pkg to Huck's GitHub Release
        env:
          GH_TOKEN: ${{ secrets.SIGNING_BRIDGE_TOKEN }}
        run: |
          gh release upload "${{ github.event.client_payload.tag }}" \
            "$PKG_PATH" \
            --repo "${{ github.event.client_payload.repo }}" \
            --clobber
