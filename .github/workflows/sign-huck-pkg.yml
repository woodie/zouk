name: Sign Huck .pkg

# Huck (github.com/woodie/huck) doesn't hold its own Developer ID certs or
# notarization credentials -- rather than duplicate those eight secrets
# into a second repo, huck's own release workflow uploads an unsigned .app
# to its GitHub Release and fires this repository_dispatch, reusing this
# repo's existing signing identity/notary account instead of a fresh one.
# See docs/COMMENTS.md.
on:
  repository_dispatch:
    types: [sign-huck-pkg]

jobs:
  sign-and-attach:
    runs-on: macos-latest

    steps:
      # Identical to release.yml's own "Import signing certificates" step
      # -- same certs, same keychain, just triggered from a different event
      # for a different app.
      - name: Import signing certificates
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
          INSTALLER_CERTIFICATE_P12_BASE64: ${{ secrets.INSTALLER_CERTIFICATE_P12_BASE64 }}
          INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.INSTALLER_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          keychain_path="$RUNNER_TEMP/signing.keychain-db"
          cert_path="$RUNNER_TEMP/certificate.p12"
          installer_cert_path="$RUNNER_TEMP/installer-certificate.p12"

          echo "$CERTIFICATE_P12_BASE64" | openssl base64 -d -A -out "$cert_path"
          echo "$INSTALLER_CERTIFICATE_P12_BASE64" | openssl base64 -d -A -out "$installer_cert_path"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"

          curl -fsSL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          curl -fsSL -o "$RUNNER_TEMP/DeveloperIDCA.cer" https://www.apple.com/certificateauthority/DeveloperIDCA.cer
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$keychain_path"
          security import "$RUNNER_TEMP/DeveloperIDCA.cer" -k "$keychain_path"

          security import "$cert_path" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security import "$installer_cert_path" -P "$INSTALLER_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$keychain_path"
          security list-keychain -d user -s "$keychain_path" $(security list-keychains -d user | sed 's/"//g')

      - name: Download Huck's unsigned .app
        run: |
          curl -fsSL -o huck-unsigned.zip "${{ github.event.client_payload.zip_url }}"
          ditto -x -k huck-unsigned.zip .

      # jpackage-built apps need explicit JVM hardened-runtime entitlements
      # (JIT/unsigned executable memory/library validation) that jpackage's
      # own --mac-sign would normally generate automatically -- not
      # available here, since signing happens externally and after the
      # fact, not during jpackage's own build. See docs/COMMENTS.md.
      - name: Sign the .app
        run: |
          cat > entitlements.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.security.cs.allow-jit</key><true/>
            <key>com.apple.security.cs.allow-unsigned-executable-memory</key><true/>
            <key>com.apple.security.cs.disable-library-validation</key><true/>
          </dict>
          </plist>
          PLIST
          codesign --force --deep --options runtime --timestamp \
            --entitlements entitlements.plist \
            --sign "Developer ID Application: John Woodell (754T277KBJ)" \
            "Huck.app"
          codesign --verify --deep --strict --verbose=2 "Huck.app"

      - name: Notarize and staple the .app
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
        run: |
          ditto -c -k --keepParent "Huck.app" huck-notarize-submission.zip
          xcrun notarytool submit huck-notarize-submission.zip \
            --apple-id "$NOTARY_APPLE_ID" \
            --password "$NOTARY_PASSWORD" \
            --team-id "$NOTARY_TEAM_ID" \
            --wait
          xcrun stapler staple "Huck.app"

      # Same --component-plist/pkgbuild shape as this repo's own `make pkg`
      # target -- BundleIsVersionChecked forced false for the same reason
      # (see this repo's Makefile comment): the Installer otherwise skips
      # the copy if CFBundleVersion isn't strictly newer than what's
      # already on disk. bundle_id/version are read from the .app's own
      # Info.plist (jpackage-generated) rather than hardcoded, since this
      # workflow has no independent source of truth for either.
      - name: Build the installer .pkg
        run: |
          bundle_id=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "Huck.app/Contents/Info.plist")
          version=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "Huck.app/Contents/Info.plist")
          mkdir -p pkgroot/Applications
          cp -R "Huck.app" "pkgroot/Applications/Huck.app"
          cat > component.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><array><dict>
          <key>BundleHasStrictIdentifier</key><true/>
          <key>BundleIsRelocatable</key><false/>
          <key>BundleIsVersionChecked</key><false/>
          <key>BundleOverwriteAction</key><string>upgrade</string>
          <key>RootRelativeBundlePath</key><string>Applications/Huck.app</string>
          </dict></array></plist>
          PLIST
          pkgbuild --root pkgroot \
            --install-location / \
            --component-plist component.plist \
            --identifier "$bundle_id" \
            --version "$version" \
            --sign "Developer ID Installer: John Woodell (754T277KBJ)" \
            "Huck-$version.pkg"
          echo "PKG_PATH=Huck-$version.pkg" >> "$GITHUB_ENV"

      - name: Notarize and staple the .pkg
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
        run: |
          xcrun notarytool submit "$PKG_PATH" \
            --apple-id "$NOTARY_APPLE_ID" \
            --password "$NOTARY_PASSWORD" \
            --team-id "$NOTARY_TEAM_ID" \
            --wait
          xcrun stapler staple "$PKG_PATH"

      # SIGNING_BRIDGE_TOKEN, not the default GITHUB_TOKEN -- this job's
      # own token is scoped to zouk, with no access to huck's repo at all.
      # Same fine-grained PAT huck's own workflow uses to trigger this
      # dispatch in the first place. See docs/COMMENTS.md.
      - name: Attach the signed .pkg to Huck's GitHub Release
        env:
          GH_TOKEN: ${{ secrets.SIGNING_BRIDGE_TOKEN }}
        run: |
          gh release upload "${{ github.event.client_payload.tag }}" \
            "$PKG_PATH" \
            --repo "${{ github.event.client_payload.repo }}" \
            --clobber
