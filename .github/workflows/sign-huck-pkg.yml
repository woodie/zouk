name: Sign Huck .pkg

# Huck (github.com/woodie/huck) doesn't hold its own Developer ID certs or
# notarization credentials -- rather than duplicate those secrets into a
# second repo, this job checks out huck's own source at the tagged
# release and runs ITS Gradle build here, on a runner that already has
# this repo's signing identity/notary account. This isn't just secret-
# sharing convenience: jpackage's own --mac-sign (wired up via Compose
# Desktop's signing/notarization DSL, driven below entirely through -P
# properties) is the only thing that can correctly sign a native library
# bundled inside a .jar (Skiko's own .dylib, in huck's case) -- an
# external `codesign --deep` on an already-built .app can't reach into
# jar-embedded content at all, which is exactly what made the previous
# version of this workflow (sign a pre-built, downloaded .app) fail
# notarization. See docs/COMMENTS.md.
on:
  repository_dispatch:
    types: [sign-huck-pkg]

jobs:
  build-sign-notarize:
    runs-on: macos-latest

    steps:
      - name: Check out huck at the release tag
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.client_payload.repo }}
          ref: ${{ github.event.client_payload.tag }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Identical to release.yml's own "Import signing certificates" step
      # -- same certs, same keychain, just triggered from a different event
      # for a different app.
      - name: Import signing certificates
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
          INSTALLER_CERTIFICATE_P12_BASE64: ${{ secrets.INSTALLER_CERTIFICATE_P12_BASE64 }}
          INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.INSTALLER_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          keychain_path="$RUNNER_TEMP/signing.keychain-db"
          cert_path="$RUNNER_TEMP/certificate.p12"
          installer_cert_path="$RUNNER_TEMP/installer-certificate.p12"

          echo "$CERTIFICATE_P12_BASE64" | openssl base64 -d -A -out "$cert_path"
          echo "$INSTALLER_CERTIFICATE_P12_BASE64" | openssl base64 -d -A -out "$installer_cert_path"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"

          curl -fsSL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          curl -fsSL -o "$RUNNER_TEMP/DeveloperIDCA.cer" https://www.apple.com/certificateauthority/DeveloperIDCA.cer
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$keychain_path"
          security import "$RUNNER_TEMP/DeveloperIDCA.cer" -k "$keychain_path"

          security import "$cert_path" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security import "$installer_cert_path" -P "$INSTALLER_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$keychain_path"
          security list-keychain -d user -s "$keychain_path" $(security list-keychains -d user | sed 's/"//g')

      # Compose Desktop's own signing/notarization DSL reads these
      # `compose.desktop.mac.*` Gradle properties directly -- no changes
      # needed in huck's build.gradle.kts at all. `identity` is the shared
      # "John Woodell (754T277KBJ)" portion of both Developer ID cert
      # names (Application and Installer): jpackage looks up whichever
      # cert type it needs for the artifact it's currently signing (the
      # .app vs. the .pkg) by matching this string against the keychain,
      # the same way release.yml's own CODESIGN_IDENTITY/
      # INSTALLER_IDENTITY split already works from one shared name. See
      # docs/COMMENTS.md.
      #
      # `notarizePkg` builds, signs, and notarizes the .pkg in one task --
      # jpackage's own --mac-sign runs during packaging itself, so it can
      # reach native libraries bundled inside .jars (unlike an external
      # `codesign --deep` on an already-built .app, which can't see into
      # jar-embedded content at all).
      - name: Build, sign, and notarize the .pkg
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
        run: |
          ./gradlew notarizePkg \
            -Pcompose.desktop.mac.sign=true \
            -Pcompose.desktop.mac.signing.identity="John Woodell (754T277KBJ)" \
            -Pcompose.desktop.mac.notarization.appleID="$NOTARY_APPLE_ID" \
            -Pcompose.desktop.mac.notarization.password="$NOTARY_PASSWORD" \
            -Pcompose.desktop.mac.notarization.teamID="$NOTARY_TEAM_ID"

      # Stapling should already happen as part of `notarizePkg`, but it's
      # cheap and idempotent to confirm/reapply explicitly here rather than
      # assume -- this is the first real run of this task against huck's
      # actual jar-embedded-dylib case, and re-stapling an already-stapled
      # .pkg is a harmless no-op.
      - name: Confirm the .pkg is stapled
        run: |
          pkg_path=$(ls build/compose/binaries/main/pkg/*.pkg)
          xcrun stapler staple "$pkg_path"
          echo "PKG_PATH=$pkg_path" >> "$GITHUB_ENV"

      # SIGNING_BRIDGE_TOKEN, not the default GITHUB_TOKEN -- this job's
      # own default token is scoped to zouk, with no access to huck's repo
      # at all. Same fine-grained PAT huck's own workflow uses to trigger
      # this dispatch in the first place. See docs/COMMENTS.md.
      - name: Attach the signed .pkg to Huck's GitHub Release
        env:
          GH_TOKEN: ${{ secrets.SIGNING_BRIDGE_TOKEN }}
        run: |
          gh release upload "${{ github.event.client_payload.tag }}" \
            "$PKG_PATH" \
            --repo "${{ github.event.client_payload.repo }}" \
            --clobber
